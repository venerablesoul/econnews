name: Keep the news bot running

on:
  schedule:
    - cron: "17,47 * * * *"
  push:
    branches: [main]
    paths: [".github/workflows/news.yml", ".github/workflows/keepalive.yml"]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: news-keepalive
  cancel-in-progress: true

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          sparse-checkout: |
            relay.py
          sparse-checkout-cone-mode: false

      - name: Start the news bot if it is not running
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELAY_REF: ${{ github.event.repository.default_branch }}
        run: python3 relay.py keepalive ${{ github.event_name == 'push' && '--fresh' || '' }}
