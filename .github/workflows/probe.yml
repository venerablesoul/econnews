name: Probe translation
on:
  push:
    branches: [probe-translation]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - run: |
          python - <<'PY'
          import json, news_bot as nb
          heads = ["Huawei convicted in US trial that exposed corporate espionage and sanctions evasion",
                   "JPMorgan Sets Below Consensus S&P 500 Target of 8,200 for 2027",
                   "Bond Traders Rush to Hedge Risk of Fed Hikes Stalling Economy",
                   "Escalation in Iran Appears As the Default",
                   "Argentina expected to suffer technical recession in blow to Milei"]
          for name in ("_google_batch", "_ms_batch"):
              for lang in ("ru", "zh", "ar"):
                  try:
                      out = getattr(nb, name)(heads, "en", lang)
                      print("PROBE", name, lang, "OK" if out and all(out) else "BAD", json.dumps(out, ensure_ascii=False))
                  except Exception as e:
                      print("PROBE", name, lang, "ERR", type(e).__name__, e)
          try:
              print("PROBE ru->en", nb._google_batch(["ЦБ сохранил ключевую ставку", "Путин оценил ситуацию на рынке нефтепродуктов"], "ru", "en"))
          except Exception as e:
              print("PROBE ru->en ERR", e)
          items = [{"title": h, "lead": ""} for h in heads]
          nb.translate_items(items, first=["ru"])
          print("PROBE items", sum(bool(it.get("title_" + l)) for it in items for l in ("ru", "zh", "ar")), "of 15")
          PY
