name: Probe data sources (temporary)
on:
  push:
    branches: [probe]
    paths: ["probe/probe.py", ".github/workflows/probe.yml"]
permissions:
  contents: write
  actions: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          GH_TOKEN: ${{ github.token }}
        run: python probe/probe.py
      - name: Save result
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add probe/out*
          git commit -m "probe result" && git push origin HEAD:probe
