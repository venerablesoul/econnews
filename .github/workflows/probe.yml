name: Probe translation
on:
  push:
    branches: [probe-translation]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          W=$(python3 -c "import json;print(json.load(open('docs/config.json'))['api'])")
          echo "PROBE worker $W"
          for u in "https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ru&dt=t&q=Oil%20prices%20jump" \
                   "https://translate.google.com/translate_a/single?client=gtx&sl=en&tl=ru&dt=t&q=Oil%20prices%20jump" \
                   "https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=en&tl=ru&q=Oil%20prices%20jump" \
                   "https://api.mymemory.translated.net/get?q=Oil%20prices%20jump&langpair=en|ru"; do
            echo "PROBE $(curl -s -m 15 -o /tmp/o -w '%{http_code}' "$u") $(head -c 160 /tmp/o | tr '\n' ' ') <- ${u:0:60}"
          done
          for i in 1 2; do
            curl -s -m 40 "$W/api/company?s=AAPL&parts=cn&lang=ru" -o /tmp/c.json
            python3 -c "
          import json; d=json.load(open('/tmp/c.json'))
          cn=d.get('cn') or []
          print('PROBE worker cn', len(cn), 'translated', sum(1 for n in cn if n.get('h')!=n.get('en')), 'errors', d.get('errors'))
          print('PROBE worker sample', [n.get('h') for n in cn[:2]])"
          done
