name: Economic news

on:
  schedule:
    # GitHub часто пропускает запуски по расписанию (бывало 1–2 раза за полдня),
    # поэтому каждый запуск работает ~5,5 ч и сам проверяет новости каждые 10 минут.
    # Расписание лишь перезапускает его, если он завершился.
    - cron: "*/30 * * * *"
  workflow_dispatch:          # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write             # чтобы сохранять state.json и данные страницы

concurrency:
  group: econ-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/news.yml

      - name: Install chart and PDF libraries
        run: pip install matplotlib pdfplumber

      - name: Collect and send news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # необязательно: факт по данным США
          MIN_LEVEL: medium       # high = только самое важное
          DIGEST_HOUR: "21"       # дневная сводка в 21:00 МСК; -1 = выключить
          CHART_HOURS: "9,21"     # когда присылать картинку с графиками (часы МСК); пусто = никогда
          MARKET_LINE: "yes"      # строка с котировками в шапке сообщений
          QUIET_HOURS: "0-8"      # ночью без звука (кроме важных)
          TRANSLATE: ru           # перевод заголовков на русский; off = не переводить
          SHOW_ORIGINAL: "no"     # yes = под переводом показывать оригинал
          SUMMARIES: "yes"        # выжимка в 1–2 предложения под заголовком
          TAGS: "yes"             # теги #нефть #ФРС #рубль ...
          MORNING_HOUR: "9"       # утренний дайджест «главное за ночь» (час МСК); -1 = выключить
          CALENDAR: "yes"         # календарь важных событий + напоминания
          CAL_COUNTRIES: "USD,EUR,CNY,GBP,JPY"  # чьи события показывать
          REMIND_MINUTES: "60"    # за сколько минут напоминать; 0 = не напоминать
          ALERTS: "yes"           # сразу сообщать, если источник перестал отвечать
          TERMINAL_BUTTON: "yes"  # кнопка «🖥 Терминал» под сообщениями
          TRADES: "yes"           # сделки политиков США и инсайдеров компаний
          CONGRESS_MIN: "15000"   # присылать сделки политиков от $15 тыс. (меньше — только в терминале)
          INSIDER_MIN_BUY: "250000"     # покупки инсайдеров от $250 тыс.
          INSIDER_MIN_SELL: "10000000"  # продажи инсайдеров от $10 млн (плановые продажи 10b5-1 не присылаются)
        run: |
          # адрес страницы «Рынок онлайн»: GitHub Pages или свой домен (переменная репозитория PAGES_URL)
          export PAGES_URL="${{ vars.PAGES_URL }}"
          [ -n "$PAGES_URL" ] || export PAGES_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          # цикл: проверка каждые 10 мин, через 5,5 ч выход (следующий запуск уже в очереди)
          LOOP_HOURS=5.5 python news_bot.py --loop 10 --git-sync

      - name: Save state
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git add docs/data.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "news update" && git pull --rebase && git push)
