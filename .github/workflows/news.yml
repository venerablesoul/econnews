name: Economic news

on:
  schedule:
    # GitHub often skips scheduled runs (sometimes 1–2 times in half a day),
    # so each run works ~5.5 h and checks the news every 5 minutes itself.
    # The schedule only restarts it when it has finished.
    - cron: "*/30 * * * *"
  workflow_dispatch:          # the "Run workflow" button for a manual start

permissions:
  contents: write             # to save state.json and the page data

concurrency:
  group: econ-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/news.yml

      - name: Install chart and PDF libraries
        run: pip install matplotlib==3.11.2 pdfplumber==0.11.10

      - name: Collect and send news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}       # optional: actual numbers for US data
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}   # optional: "Name your@email" for the SEC site
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }} # free key: company ratios and the earnings calendar (EQS)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional: AI notes on key stories
          COMPANIES: "yes"        # US companies, financials, yield curves and rates for the terminal
          MIN_LEVEL: medium       # high = only the most important
          DIGEST_HOUR: "21"       # the day in review at 21:00 MSK; -1 = off
          CHART_HOURS: "9,21"     # when to send the chart picture (MSK hours); empty = never
          MARKET_LINE: "yes"      # a line with quotes in message headers
          QUIET_HOURS: "0-8"      # silent at night (except key news)
          TRANSLATE: "yes"        # translate headlines into the other language (EN↔RU); off = no translation
          SHOW_ORIGINAL: "no"     # yes = show the original under the translation
          SUMMARIES: "yes"        # a 1–2 sentence summary under the headline
          TAGS: "yes"             # tags #oil #Fed #ruble ...
          MORNING_HOUR: "9"       # morning digest "overnight highlights" (MSK hour); -1 = off
          CALENDAR: "yes"         # calendar of key events + reminders
          CAL_COUNTRIES: "USD,EUR,CNY,GBP,JPY"  # whose events to show
          REMIND_MINUTES: "60"    # how many minutes before to remind; 0 = never
          ALERTS: "yes"           # report at once when a source stops responding
          TERMINAL_BUTTON: "yes"  # the «🖥 Terminal» button under messages
          TRADES: "yes"           # trades of US politicians and company insiders
          CONGRESS_MIN: "15000"   # send politicians' trades from $15K (smaller ones — terminal only)
          INSIDER_MIN_BUY: "250000"     # insider buys from $250K
          INSIDER_MIN_SELL: "10000000"  # insider sales from $10M (planned 10b5-1 sales are not sent)
        run: |
          # the Markets page address: GitHub Pages or your own domain (repository variable PAGES_URL)
          export PAGES_URL="${{ vars.PAGES_URL }}"
          [ -n "$PAGES_URL" ] || export PAGES_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          # loop: a check every 5 min, exit after 5.5 h (the next run is already queued);
          # the site updates at most every 10 minutes, fresh news go to the bot server at once
          LOOP_HOURS=5.5 python news_bot.py --loop 5 --git-sync

      - name: Save state
        if: always()
        # the same save as inside the loop: survives a race with other commits and a stuck rebase
        run: python -c "import news_bot; news_bot.git_sync('push', '.')"
