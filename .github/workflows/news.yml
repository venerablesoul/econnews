name: Economic news

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: econ-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        continue-on-error: true
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install chart and PDF libraries
        continue-on-error: true
        run: python3 -m pip install -r requirements.txt

      - name: Chinese font for the chart picture
        continue-on-error: true
        timeout-minutes: 3
        run: fc-list :lang=zh | grep -q . || (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk >/dev/null && fc-cache -f >/dev/null)

      - name: Check the code
        run: |
          report="$RUNNER_TEMP/selfcheck.txt"
          if timeout 300 python3 news_bot.py --selfcheck >"$report" 2>&1; then
            tail -n 1 "$report"
            exit 0
          fi
          cat "$report"
          bad=$(git rev-parse HEAD)
          good=""
          if git fetch -q --depth=1 origin gh-pages; then
            good=$(git show FETCH_HEAD:state.json | python3 -c 'import json, sys; print((json.load(sys.stdin).get("code_ok") or {}).get("sha") or "")') || good=""
          fi
          if [ -z "$good" ] || [ "$good" = "$bad" ]; then
            echo "::warning::main ($bad) fails its self-check and no earlier working version is known — running it anyway"
            exit 0
          fi
          if git fetch -q --depth=1 origin "$good" && git -c advice.detachedHead=false checkout -q "$good" \
              && timeout 300 python3 news_bot.py --selfcheck >/dev/null 2>&1; then
            { echo "BOT_PINNED=$good"; echo "BOT_MAIN_BAD=$bad"; echo "BOT_MAIN_REPORT=$report"; } >> "$GITHUB_ENV"
            echo "::warning::main ($bad) fails its self-check — this session runs the last version that worked ($good)"
          else
            git checkout -q -f "${GITHUB_REF_NAME:-main}" || git checkout -q -f "$bad" || true
            echo "::warning::the last version that worked ($good) cannot be used either — running main ($bad)"
          fi

      - name: Collect and send news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          RELAY_REF: ${{ github.event.repository.default_branch }}
          COMPANIES: "yes"
          MIN_LEVEL: medium
          DIGEST_HOUR: "21"
          CHART_HOURS: "9,21"
          MARKET_LINE: "yes"
          QUIET_HOURS: "0-8"
          TRANSLATE: "yes"
          SHOW_ORIGINAL: "no"
          SUMMARIES: "yes"
          TAGS: "yes"
          MORNING_HOUR: "9"
          BRIEF_HOUR: "16"
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          CALENDAR: "yes"
          CAL_COUNTRIES: "USD,EUR,CNY,GBP,JPY"
          REMIND_MINUTES: "60"
          ALERTS: "yes"
          TERMINAL_BUTTON: "yes"
          TRADES: "yes"
          CONGRESS_MIN: "15000"
          INSIDER_MIN_BUY: "250000"
          INSIDER_MIN_SELL: "10000000"
        run: |
          export PAGES_URL="${{ vars.PAGES_URL }}"
          [ -n "$PAGES_URL" ] || export PAGES_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          LOOP_HOURS=5.5 python3 news_bot.py --loop 5 --git-sync

      - name: Save state
        if: always()
        run: python3 -c "import news_bot; news_bot.git_sync('push', '.')"

      - name: Make sure the next session is queued
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELAY_REF: ${{ github.event.repository.default_branch }}
        run: python3 relay.py next --if-healthy
