name: Bot server (Cloudflare)

# Deploys the bot server (the worker/ folder) to Cloudflare Workers (free plan):
# instant answers to /start and commands, subscribers and their languages, live quotes and company data
# for the terminal with the API keys hidden on the server.
# Runs by itself when worker/ changes, or by hand: Actions → Bot server (Cloudflare) → Run workflow.
# One-time setup: the CLOUDFLARE_API_TOKEN secret (a token with the "Edit Cloudflare Workers" template).

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:

permissions:
  contents: write             # save the server address to docs/config.json

concurrency:
  group: bot-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}   # optional: found automatically
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}             # the bot owner
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}               # free key — for everyone
      EODHD_API_KEY: ${{ secrets.EODHD_API_KEY }}                   # optional paid key — owner only (Yahoo is used for free otherwise)
      TERMINAL_PASSWORD: ${{ secrets.TERMINAL_PASSWORD }}           # optional: owner sign-in to the terminal from a browser
    steps:
      - name: Check that Cloudflare is set up
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::notice::The bot server is not set up yet (no CLOUDFLARE_API_TOKEN secret) — skipping."
              echo "SKIP=1" >> "$GITHUB_ENV"
            else
              echo "::error::The CLOUDFLARE_API_TOKEN secret is missing (create a token with the \"Edit Cloudflare Workers\" template)."
              exit 1
            fi
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        if: env.SKIP != '1'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        if: env.SKIP != '1'
        with:
          node-version: "22"

      - name: Prepare Cloudflare (account, subscribers storage, workers.dev)
        if: env.SKIP != '1'
        run: |
          echo "PAGES_URL=${{ vars.PAGES_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}" >> "$GITHUB_ENV"
          python3 worker/deploy.py prepare

      - name: Deploy server
        if: env.SKIP != '1'
        working-directory: worker
        run: npx --yes wrangler@4.153.0 deploy --var "PAGES_URL:${PAGES_URL,,}"

      - name: Upload keys as server secrets
        if: env.SKIP != '1'
        working-directory: worker
        run: |
          python3 deploy.py secrets
          npx --yes wrangler@4.153.0 secret bulk .secrets.json
          rm -f .secrets.json

      - name: Connect Telegram and check everything
        if: env.SKIP != '1'
        run: python3 worker/deploy.py telegram

      - name: Save server address for the bot and terminal
        if: env.SKIP != '1'
        run: |
          echo "::notice::Bot server: $WORKER_URL"
          python3 worker/deploy.py config
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add docs/config.json
          if git diff --cached --quiet; then
            echo "The server address did not change"
          else
            git commit -m "bot server address"
            ok=0
            for i in 1 2 3 4 5; do
              if git pull --rebase --autostash origin main && git push origin HEAD:main; then ok=1; break; fi
              sleep 5
            done
            [ "$ok" = 1 ] || { echo "::error::Could not save docs/config.json to the repository"; exit 1; }
          fi
