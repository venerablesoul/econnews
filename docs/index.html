<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Markets</title>
<meta name="color-scheme" content="dark">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="terminal/i18n.js"></script>
<style>
  :root{
    --bg:#0e1116; --card:#161b22; --card2:#1b212b; --line:#232b37;
    --text:#e9edf3; --muted:#8b95a7; --faint:#5d6778;
    --up:#2fbf71; --down:#ef5350; --flat:#9aa4b5; --accent:#6ea8ff;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased}
  a{color:inherit}
  .wrap{max-width:980px;margin:0 auto;padding:16px 16px 40px}
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 14px}
  h1{font-size:26px;line-height:1.1;margin:0;letter-spacing:-.02em}
  .upd{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:7px;white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--up);box-shadow:0 0 0 0 rgba(47,191,113,.6);animation:pulse 2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,191,113,.55)}70%{box-shadow:0 0 0 8px rgba(47,191,113,0)}100%{box-shadow:0 0 0 0 rgba(47,191,113,0)}}
  .tape{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card);margin-bottom:14px;min-height:46px}

  .tiles{display:flex;gap:10px;margin:0 -16px 16px;padding:0 16px 4px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
  .tiles::-webkit-scrollbar{display:none}
  .tiles .tile{flex:0 0 44%;scroll-snap-align:start}
  @media(min-width:720px){.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin:0 0 18px;padding:0;overflow:visible}.tiles .tile{flex:none}}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px 8px;min-width:0}
  .tile .n{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tile .row{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-top:2px}
  .tile .p{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tile .c{font-size:13px;font-weight:700;white-space:nowrap}
  .tile svg{display:block;width:100%;height:34px;margin-top:6px}
  .up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--flat)}
  .skel{background:linear-gradient(90deg,var(--card) 0,var(--card2) 50%,var(--card) 100%);background-size:200% 100%;animation:sh 1.4s infinite;height:84px}
  @keyframes sh{to{background-position:-200% 0}}

  .tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px;position:sticky;top:8px;z-index:5}
  .tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:600 14px/1 inherit;padding:10px 6px;border-radius:9px;cursor:pointer}
  .tabs button[aria-selected=true]{background:var(--card2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
  .panel{display:none}
  .panel.on{display:block}
  .box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
  .box h2{font-size:13px;font-weight:600;color:var(--muted);margin:0;padding:12px 14px 0;text-transform:uppercase;letter-spacing:.06em}

  .filters{display:flex;gap:8px;margin-bottom:10px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--muted);font:600 13px/1 inherit;padding:8px 12px;border-radius:999px;cursor:pointer}
  .chip[aria-pressed=true]{color:var(--text);border-color:#3a4658;background:var(--card2)}
  .news{list-style:none;margin:0;padding:0}
  .news li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px 10px 15px;margin-bottom:8px;position:relative}
  .news li::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:#e0b23c}
  .news li.high::before{background:var(--down)}
  .news a{text-decoration:none;font-weight:600;display:block}
  .news a:hover{color:var(--accent)}
  .news .orig{color:var(--faint);font-size:12.5px;margin-top:2px}
  .news .lead{color:var(--muted);font-size:13.5px;line-height:1.4;margin-top:4px}
  .news .meta{color:var(--muted);font-size:12.5px;margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
  .day{color:var(--faint);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin:14px 2px 8px}
  .note{color:var(--faint);font-size:12px;margin:0;padding:8px 14px 12px}
  .empty{color:var(--muted);text-align:center;padding:30px 10px}
  footer{color:var(--faint);font-size:12px;text-align:center;margin-top:22px}
  .lang{border:1px solid var(--line);background:var(--card);color:var(--muted);font:600 12px/1 inherit;padding:6px 9px;border-radius:999px;cursor:pointer;margin-left:8px}
  .lang:hover{color:var(--text)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="h1">Markets</h1>
    <div class="upd"><span class="dot"></span><span id="upd">loading…</span><button class="lang" id="lang">RU</button></div>
  </header>

  <div class="tape" id="tape"></div>

  <div class="tiles" id="tiles">
    <div class="tile skel"></div><div class="tile skel"></div><div class="tile skel"></div><div class="tile skel"></div>
  </div>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="charts" aria-selected="true" data-k="charts">Charts</button>
    <button role="tab" data-tab="news" aria-selected="false" data-k="news">News</button>
    <button role="tab" data-tab="cal" aria-selected="false" data-k="cal">Calendar</button>
  </nav>

  <section class="panel on" id="p-charts">
    <div class="box"><div id="w-overview" style="height:440px"></div></div>
    <div class="box"><h2 data-k="all_markets">All markets</h2><div id="w-market" style="height:640px"></div>
      <p class="note" data-k="bonds_note">Bonds are shown by price: when the price rises, the yield falls. US yields themselves are in the tiles at the top.</p></div>
    <div class="box"><h2 data-k="crypto_map">Crypto · heat map</h2><div id="w-cryptomap" style="height:480px"></div></div>
  </section>

  <section class="panel" id="p-news">
    <div class="filters">
      <button class="chip" data-f="all" aria-pressed="true" data-k="all">All</button>
      <button class="chip" data-f="high" aria-pressed="false" data-k="top">🔴 Top only</button>
    </div>
    <ul class="news" id="news"><li class="empty" data-k="news_loading">Loading news…</li></ul>
  </section>

  <section class="panel" id="p-cal">
    <div class="box"><h2 data-k="calendar">Economic calendar</h2><div id="w-cal" style="height:640px"></div></div>
  </section>

  <footer data-k="footer">Live charts — TradingView · tiles and news — the bot, updated every ~5 minutes</footer>
</div>

<script>
(function(){
  var I = window.L10N, RU = I.ru;
  // texts of this page: [English, Russian]
  var P = {
    h1: ['Markets', 'Рынок онлайн'], loading: ['loading…', 'загрузка…'], charts: ['Charts', 'Графики'], news: ['News', 'Новости'], cal: ['Calendar', 'Календарь'],
    all_markets: ['All markets', 'Все рынки'],
    bonds_note: ['Bonds are shown by price: when the price rises, the yield falls. US yields themselves are in the tiles at the top.',
      'Облигации показаны ценой: когда цена растёт, доходность падает. Сами доходности США — в плитках вверху.'],
    crypto_map: ['Crypto · heat map', 'Криптовалюты · тепловая карта'], all: ['All', 'Все'], top: ['🔴 Top only', '🔴 Только главное'],
    news_loading: ['Loading news…', 'Загрузка новостей…'], calendar: ['Economic calendar', 'Экономический календарь'],
    footer: ['Live charts — TradingView · tiles and news — the bot, updated every ~5 minutes', 'Живые графики — TradingView · плитки и новости — бот, обновление каждые ~5 минут'],
    t_idx: ['Indices', 'Индексы'], t_cmd: ['Commodities', 'Сырьё'], t_fx: ['Currencies', 'Валюты'], t_bonds: ['Bonds', 'Облигации'], t_crypto: ['Crypto', 'Крипто'],
    just_now: ['just now', 'только что'], today: ['Today', 'Сегодня'], yesterday: ['Yesterday', 'Вчера'],
    no_news: ['No news to show yet', 'Пока нет новостей для показа'], not_ready: ["the bot's data is not ready yet", 'данные бота пока не готовы'],
    first_run: ["News appears after the bot's first run", 'Новости появятся после первого запуска бота'], chart_for: [' · chart for ', ' · график за ']
  };
  function T(k){ return P[k][RU ? 1 : 0] }
  document.querySelectorAll('[data-k]').forEach(function(e){ e.textContent = T(e.dataset.k) });
  document.getElementById('h1').textContent = T('h1'); document.title = T('h1'); document.documentElement.lang = I.lang;
  document.getElementById('upd').textContent = T('loading');
  var lb = document.getElementById('lang'); lb.textContent = RU ? 'EN' : 'RU'; lb.title = RU ? 'Switch to English' : 'Русский язык';
  lb.onclick = function(){ I.setLang(RU ? 'en' : 'ru') };

  // ---------- Telegram Mini App ----------
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg && tg.initData !== undefined) {
    try { tg.ready(); tg.expand(); tg.setHeaderColor('#0e1116'); tg.setBackgroundColor('#0e1116'); } catch(e){}
  }

  // ---------- TradingView: live widgets ----------
  function tv(el, name, cfg){
    var host = document.getElementById(el);
    if (!host || host.dataset.done) return;
    host.dataset.done = 1;
    host.innerHTML = '<div class="tradingview-widget-container" style="height:100%;width:100%"><div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div></div>';
    var s = document.createElement('script');
    s.src = 'https://s3.tradingview.com/external-embedding/embed-widget-' + name + '.js';
    s.async = true;
    s.innerHTML = JSON.stringify(Object.assign({colorTheme:'dark', isTransparent:true, locale:I.tv}, cfg));
    host.firstChild.appendChild(s);
  }
  function n(en, ru){ return RU ? ru : en }
  var SYM = [
    ['S&P 500','FOREXCOM:SPXUSD'], ['Nasdaq 100','FOREXCOM:NSXUSD'], [n('Brent crude', 'Нефть Brent'),'TVC:UKOIL'],
    [n('Gold', 'Золото'),'TVC:GOLD'], ['EUR/USD','FX:EURUSD'], ['USD/RUB','FX_IDC:USDRUB'],
    [n('US Dollar Index', 'Индекс доллара'),'TVC:DXY'], [n('Bitcoin', 'Биткоин'),'BITSTAMP:BTCUSD']
  ];
  var CRYPTO = [
    ['BTC',n('Bitcoin', 'Биткоин')], ['ETH','Ethereum'], ['SOL','Solana'], ['BNB','BNB'], ['XRP','XRP'], ['TON','Toncoin'],
    ['DOGE','Dogecoin'], ['ADA','Cardano'], ['TRX','TRON'], ['AVAX','Avalanche'], ['LINK','Chainlink'],
    ['DOT','Polkadot'], ['LTC','Litecoin'], ['SUI','Sui']
  ];
  tv('tape','ticker-tape',{symbols:SYM.map(function(s){return {description:s[0],proName:s[1]}}), showSymbolLogo:true, displayMode:'adaptive'});
  function chartsTab(){
    tv('w-overview','symbol-overview',{
      symbols:SYM.map(function(s){return [s[0], s[1]+'|1D']}),
      chartOnly:false, autosize:true, width:'100%', height:'100%', showVolume:false, hideDateRanges:false,
      scalePosition:'right', scaleMode:'Normal', chartType:'area', lineWidth:2, lineType:0,
      fontColor:'#8b95a7', gridLineColor:'rgba(35,43,55,0.6)', dateRanges:['1d|5','5d|30','1m|1D','3m|1D','12m|1W','60m|1W'],
      upColor:'#2fbf71', downColor:'#ef5350', borderUpColor:'#2fbf71', borderDownColor:'#ef5350',
      wickUpColor:'#2fbf71', wickDownColor:'#ef5350', backgroundColor:'rgba(0,0,0,0)'
    });
    tv('w-market','market-overview',{
      dateRange:'1D', showChart:true, width:'100%', height:'100%', showSymbolLogo:true, showFloatingTooltip:true,
      plotLineColorGrowing:'#2fbf71', plotLineColorFalling:'#ef5350', belowLineFillColorGrowing:'rgba(47,191,113,0.12)',
      belowLineFillColorFalling:'rgba(239,83,80,0.12)', gridLineColor:'rgba(35,43,55,0)', scaleFontColor:'#8b95a7',
      tabs:[
        {title:T('t_idx'), symbols:[{s:'FOREXCOM:SPXUSD',d:'S&P 500'},{s:'FOREXCOM:NSXUSD',d:'Nasdaq 100'},{s:'FOREXCOM:DJI',d:'Dow Jones'},{s:'INDEX:DEU40',d:'DAX'},{s:'INDEX:NKY',d:'Nikkei 225'},{s:'TVC:HSI',d:'Hang Seng'}]},
        {title:T('t_cmd'), symbols:[{s:'TVC:UKOIL',d:n('Brent crude','Нефть Brent')},{s:'TVC:USOIL',d:n('WTI crude','Нефть WTI')},{s:'TVC:GOLD',d:n('Gold','Золото')},
          {s:'TVC:SILVER',d:n('Silver','Серебро')},{s:'OANDA:NATGASUSD',d:n('Natural gas','Природный газ')},{s:'OANDA:XCUUSD',d:n('Copper','Медь')},
          {s:'OANDA:XPTUSD',d:n('Platinum','Платина')},{s:'OANDA:WHEATUSD',d:n('Wheat','Пшеница')}]},
        {title:T('t_fx'), symbols:[{s:'FX:EURUSD',d:'EUR/USD'},{s:'FX:USDJPY',d:'USD/JPY'},{s:'FX:GBPUSD',d:'GBP/USD'},{s:'FX_IDC:USDCNY',d:'USD/CNY'},{s:'FX_IDC:USDRUB',d:'USD/RUB'},{s:'TVC:DXY',d:n('US Dollar Index','Индекс доллара')}]},
        {title:T('t_bonds'), symbols:[{s:'OANDA:USB02YUSD',d:n('US 2Y (price)','США 2 года (цена)')},{s:'OANDA:USB10YUSD',d:n('US 10Y (price)','США 10 лет (цена)')},
          {s:'OANDA:USB30YUSD',d:n('US 30Y (price)','США 30 лет (цена)')},{s:'OANDA:DE10YBEUR',d:n('Germany 10Y (price)','Германия 10 лет (цена)')},
          {s:'OANDA:UK10YBGBP',d:n('UK 10Y (price)','Великобритания 10 лет (цена)')},{s:'NASDAQ:TLT',d:n('Long US Treasury ETF','ETF длинных облигаций США')}]},
        {title:T('t_crypto'), symbols:CRYPTO.map(function(c){return {s:'BINANCE:'+c[0]+'USDT', d:c[1]}})}
      ]
    });
  }
  function cryptoMap(){
    tv('w-cryptomap','crypto-coins-heatmap',{dataSource:'Crypto', blockSize:'market_cap_calc', blockColor:'24h_close_change|5',
      locale:I.tv, symbolUrl:'', hasTopBar:false, isDataSetEnabled:false, isZoomEnabled:true, hasSymbolTooltip:true,
      isMonoSize:false, width:'100%', height:'100%'});
  }
  function calTab(){
    tv('w-cal','events',{width:'100%', height:'100%', importanceFilter:'0,1', countryFilter:'us,eu,cn,ru,gb,jp,de'});
  }
  chartsTab();
  cryptoMap();

  // ---------- tabs ----------
  var tabs = document.querySelectorAll('.tabs button');
  function show(name){
    tabs.forEach(function(b){ b.setAttribute('aria-selected', b.dataset.tab === name) });
    document.querySelectorAll('.panel').forEach(function(p){ p.classList.toggle('on', p.id === 'p-' + name) });
    if (name === 'cal') calTab();
    try { localStorage.setItem('tab', name) } catch(e){}
    if (tg && tg.HapticFeedback) try { tg.HapticFeedback.selectionChanged() } catch(e){}
  }
  tabs.forEach(function(b){ b.addEventListener('click', function(){ show(b.dataset.tab) }) });
  try { var saved = localStorage.getItem('tab'); if (saved) show(saved) } catch(e){}

  // ---------- the bot's data: tiles and news ----------
  var data = null, filter = 'all';
  function ago(iso){
    var m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (m < 1) return T('just_now');
    if (m < 60) return m + (RU ? ' мин назад' : ' min ago');
    var h = Math.round(m / 60);
    if (h < 24) return h + (RU ? ' ч назад' : ' h ago');
    return Math.round(h / 24) + (RU ? ' дн назад' : ' d ago');
  }
  function hhmm(iso){ return new Date(iso).toLocaleTimeString(I.date,{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Moscow'}) + ' ' + I.tz }
  function dayLabel(iso){
    var d = new Date(iso), now = new Date();
    var f = function(x){ return x.toLocaleDateString('en-GB',{timeZone:'Europe/Moscow'}) };
    if (f(d) === f(now)) return T('today');
    if (f(d) === f(new Date(now - 864e5))) return T('yesterday');
    return d.toLocaleDateString(I.date,{day:'numeric',month:'long',timeZone:'Europe/Moscow'});
  }
  function el(tag, cls, text){ var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e }
  function fmt(v, d){ return Number(v).toLocaleString(I.num, {minimumFractionDigits:d, maximumFractionDigits:d}) }
  function spark(vals, cls){
    var w = 120, h = 34, lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals), sp = (hi - lo) || 1;
    var pts = vals.map(function(v, i){ return [(i / (vals.length - 1)) * w, h - 3 - ((v - lo) / sp) * (h - 6)] });
    var d = pts.map(function(p, i){ return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1) }).join(' ');
    var col = cls === 'up' ? 'var(--up)' : cls === 'down' ? 'var(--down)' : 'var(--flat)';
    var ns = 'http://www.w3.org/2000/svg', svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h); svg.setAttribute('preserveAspectRatio', 'none');
    var area = document.createElementNS(ns, 'path');
    area.setAttribute('d', d + ' L' + w + ' ' + h + ' L0 ' + h + ' Z'); area.setAttribute('fill', col); area.setAttribute('opacity', '.13');
    var line = document.createElementNS(ns, 'path');
    line.setAttribute('d', d); line.setAttribute('fill', 'none'); line.setAttribute('stroke', col);
    line.setAttribute('stroke-width', '1.8'); line.setAttribute('vector-effect', 'non-scaling-stroke'); line.setAttribute('stroke-linejoin', 'round');
    svg.appendChild(area); svg.appendChild(line);
    return svg;
  }
  function priceText(q){
    if (q.value == null) return q.price;   // older data.json: a ready Russian-formatted string
    return (q.prefix || '') + fmt(q.value, q.digits != null ? q.digits : 2) + (q.suffix || '');
  }
  function changeText(c){
    if (c == null) return '';
    var s = Math.abs(c).toFixed(1);
    return (c > 0.005 ? '▲' : c < -0.005 ? '▼' : '•') + (RU ? s.replace('.', ',') : s) + '%';
  }
  function renderTiles(){
    var box = document.getElementById('tiles'); box.innerHTML = '';
    (data.market || []).filter(function(q){ return !q.terminal }).forEach(function(q){
      var cls = q.change == null || Math.abs(q.change) < 0.005 ? 'flat' : (q.change > 0 ? 'up' : 'down');
      var name = I.mktName(q.id, RU ? q.name : q.name_en || q.name);
      var t = el('div', 'tile');
      t.title = name + T('chart_for') + (q.days ? q.days + (RU ? ' дн.' : ' days') : q.period);
      t.appendChild(el('div', 'n', name));
      var row = el('div', 'row');
      row.appendChild(el('div', 'p', priceText(q)));
      row.appendChild(el('div', 'c ' + cls, changeText(q.change)));
      t.appendChild(row);
      if (q.spark && q.spark.length > 1) t.appendChild(spark(q.spark, cls));
      box.appendChild(t);
    });
    if (!box.children.length) box.style.display = 'none';
  }
  function renderNews(){
    var ul = document.getElementById('news'); ul.innerHTML = '';
    var items = (data.news || []).filter(function(n){ return filter === 'all' || n.level === 'high' });
    if (!items.length){ ul.appendChild(el('li', 'empty', T('no_news'))); return }
    var last = '';
    items.forEach(function(n){
      var lbl = dayLabel(n.ts);
      if (lbl !== last){ ul.appendChild(el('div', 'day', lbl)); last = lbl }
      var li = el('li', n.level);
      var title = I.newsTitle(n), lead = I.newsLead(n), sum = I.aiSum(n);
      var a = el('a', null, title);
      if (n.link){ a.href = n.link; a.target = '_blank'; a.rel = 'noopener' }
      li.appendChild(a);
      // the original headline under the translation (when the reader's language is not the original one)
      var orig = n.original !== undefined && n.lang === undefined ? (RU ? n.original : '') : (n.title !== title ? n.title : '');
      if (orig) li.appendChild(el('div', 'orig', orig));
      if (sum) li.appendChild(el('div', 'lead', '💡 ' + sum));
      else if (lead) li.appendChild(el('div', 'lead', lead));
      var tags = (n.tags || []).map(function(t){ return '#' + I.tag(t) }).join(' ');
      li.appendChild(el('div', 'meta', hhmm(n.ts) + ' · ' + (n.sources || []).map(I.source).join(', ') + (tags ? ' · ' + tags : '')));
      ul.appendChild(li);
    });
  }
  document.querySelectorAll('.chip').forEach(function(c){
    c.addEventListener('click', function(){
      filter = c.dataset.f;
      document.querySelectorAll('.chip').forEach(function(x){ x.setAttribute('aria-pressed', x === c) });
      if (data) renderNews();
    });
  });
  document.getElementById('news').addEventListener('click', function(e){
    var a = e.target.closest('a');
    if (a && a.href && tg && tg.openLink){ e.preventDefault(); tg.openLink(a.href) }
  });
  var bot = RU ? 'бот: ' : 'bot: ';
  function load(){
    fetch('data.json?t=' + Date.now(), {cache:'no-store'}).then(function(r){ return r.json() }).then(function(d){
      data = d; renderTiles(); renderNews();
      document.getElementById('upd').textContent = bot + ago(d.updated);
    }).catch(function(){
      document.getElementById('upd').textContent = T('not_ready');
      document.getElementById('tiles').style.display = 'none';
      var ul = document.getElementById('news'); ul.innerHTML = ''; ul.appendChild(el('li', 'empty', T('first_run')));
    });
  }
  load();
  setInterval(load, 120000);
  setInterval(function(){ if (data) document.getElementById('upd').textContent = bot + ago(data.updated) }, 30000);
})();
</script>
</body>
